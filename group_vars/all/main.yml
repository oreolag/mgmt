---
# Template: configure these values for your own infrastructure before use.

# ansible (ansible_user must have an authorized SSH key, sudo access, and odev-admins membership)
ansible_user: your_user 
ansible_become: true
ansible_become_method: sudo

# banner
banner:
  remote_path: /opt

# CLI
cli:
  # Local CLI checkout on the computer running omgmt, used by odev_install_local.
  # Example: /Users/javier/src/github.com/oreolag/cli
  local_path: ""

# CMDB
cmdb:
  remote_path: /opt

# tailscale
tailscale:
  # Fill in your own tailnet ID and DNS name before running Tailscale tasks.
  tailnet_id: ""
  tailnet_dns_name: ""
