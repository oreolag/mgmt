---
# Template: configure these values for your own infrastructure before use.
ansible_user: root
ansible_become_method: sudo

#banner
banner:
  remote_path: /opt

cli:
  local_path: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/CLI_LOCAL_PATH') | trim }}"

tailscale:
  # Fill in your own tailnet ID and DNS name before running Tailscale tasks.
  tailnet_id: ""
  tailnet_dns_name: ""

# Add your own usernames to the relevant lists, for example: [example_user].
# Keep personal access configuration out of the public template.
users:
  login:
    - xxx
  login_deleted:
    - xxx
  odev_admins: 
    - xxx
  odev_developers: 
    - xxx
  odev_users: 
    - xxx
  passwordless_sudo: 
    - xxx
